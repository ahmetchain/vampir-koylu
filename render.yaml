# Render "Blueprint" dosyası: Render panelinde New > Blueprint seçip bu depoyu bağlayınca
# oyun sunucusu (arayüz dahil) tek bir web servisi olarak kurulur.
services:
  - type: web
    name: vampir-koylu
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
# Arayüzü ayrıca Netlify'da yayınlıyorsan Render panelinde CLIENT_ORIGIN ortam değişkenine
# Netlify adresini ekle (README'deki adımlara bak).
